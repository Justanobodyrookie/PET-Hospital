services:
  db:
    image: mysql:8.0
    container_name: pet_hospital
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '3309:3306'
    volumes:
      - ./mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - data_network
  crawler:
    build: ./crawler
    volumes:
      - ./crawler:/app
      - ./crawls:/app/crawls
    env_file:
      - .env
    depends_on:
      - db
    command: tail -f /dev/null
    networks:
      - data_network
  api:
    build: ./api
    volumes:
      - ./api:/app
    restart: always
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      - db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - data_network
networks:
  data_network:
    driver: bridge